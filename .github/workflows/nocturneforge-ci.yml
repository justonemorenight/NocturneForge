name: NocturneForge CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

concurrency:
  group: nocturneforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Cargo registry and Git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  orchestration:
    name: Agent orchestration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Cargo registry, Git dependencies, and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-orchestration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-orchestration-

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Run orchestration tests
        run: cargo test -p agent_orchestration
        timeout-minutes: 30

  agent:
    name: Agent crate tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Cargo registry, Git dependencies, and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-agent-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-agent-

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Run agent library tests
        run: cargo test -p agent --lib
        timeout-minutes: 45

      - name: Run ACP, picker, Git, and encoding regression tests
        env:
          ZED_HEADLESS: '1'
          RUST_LOG: 'off'
        run: cargo test -p acp_thread -p agent_servers -p agent_ui -p git -p file_content --lib
        timeout-minutes: 45

      - name: Run project search regression tests
        env:
          ZED_HEADLESS: '1'
          RUST_LOG: 'off'
        run: cargo test -p project --features test-support --test integration search
        timeout-minutes: 45

      - name: Run worktree streaming regression tests
        env:
          ZED_HEADLESS: '1'
          RUST_LOG: 'off'
        run: cargo test -p worktree --lib test_stream_utf8
        timeout-minutes: 30
